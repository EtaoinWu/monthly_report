[project]
name = "monthly-report"
version = "0.1.0"
description = "Typed data pipeline for QQ/TG monthly report analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "emoji>=2.14.1",
  "ipykernel>=7.2.0",
  "jieba>=0.42.1",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "pandas>=2.2.3",
  "pillow>=11.0.0",
  "pySankey>=0.0.1",
  "python-dateutil>=2.9.0.post0",
  "randomcolor>=0.4.4.6",
  "seaborn>=0.13.2",
  "tqdm>=4.67.1",
  "wordcloud>=1.9.4",
]

[project.scripts]
monthly-report = "monthly_report.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pandas-stubs>=2.2.3.250308",
  "ruff>=0.9.10",
  "types-python-dateutil>=2.9.0.20241206",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
