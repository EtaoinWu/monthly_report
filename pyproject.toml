[project]
name = "monthly-report"
version = "0.1.0"
description = "Typed data pipeline for QQ/TG monthly report analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "emoji>=2.14.1",
  "ipykernel>=7.2.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "orjson>=3.13.0",
  "pillow>=11.0.0",
  "polars>=2.1.0",
  "rjieba>=0.2.2",
  "tzdata>=2026.6",
  "wordcloud>=1.9.4",
]

[project.scripts]
monthly-report = "monthly_report.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "ruff>=0.9.10",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
